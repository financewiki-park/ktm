name: Build native ktm terminal

on:
  workflow_dispatch:

jobs:
  kindlehf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext intltool flex bison gperf help2man texinfo libarchive-dev nettle-dev aria2 zstd libncurses-dev libglib2.0-dev-bin
      - name: Install Kindle SDK
        run: |
          mkdir -p "$HOME/x-tools"
          curl -fsSL https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz | tar -xzf - -C "$HOME"
          git clone --depth 1 --recurse-submodules https://github.com/KindleModding/kindle-sdk.git /tmp/kindle-sdk
          bash /tmp/kindle-sdk/gen-sdk.sh kindlehf
      - name: Build static VTE and patched KTerm
        run: |
          set -eu
          target=arm-kindlehf-linux-gnueabihf
          toolchain="$HOME/x-tools/$target"
          sysroot="$toolchain/$target/sysroot"
          export PATH="$toolchain/bin:$PATH"
          export PKG_CONFIG_SYSROOT_DIR="$sysroot"
          export PKG_CONFIG_LIBDIR="$sysroot/usr/lib/pkgconfig"
          chmod -R u+w "$sysroot/usr"
          curl -fsSL https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz -o /tmp/ncurses.tar.gz
          tar -xzf /tmp/ncurses.tar.gz -C /tmp
          cd /tmp/ncurses-6.4
          CC="$target-gcc" ./configure --host="$target" --prefix="$sysroot/usr" --without-shared --with-normal --without-debug --without-ada --without-cxx --without-manpages --without-tests --without-progs
          make -j2
          make install.libs install.includes
          cat > "$sysroot/usr/lib/pkgconfig/gio-unix-2.0.pc" <<'EOF'
          Name: gio-unix
          Description: GIO Unix extensions supplied by Kindle firmware
          Version: 2.26.0
          Requires: gio-2.0
          EOF
          cat > "$sysroot/usr/lib/pkgconfig/cairo-xlib.pc" <<'EOF'
          Name: cairo-xlib
          Description: Cairo Xlib backend supplied by Kindle firmware
          Version: 1.10.2
          Requires: cairo x11
          EOF
          curl -fsSL https://download.gnome.org/sources/vte/0.28/vte-0.28.2.tar.xz -o /tmp/vte.tar.xz
          tar -xJf /tmp/vte.tar.xz -C /tmp
          cd /tmp/vte-0.28.2
          CC="$target-gcc" CPPFLAGS="-I$sysroot/usr/include" ./configure --host="$target" --disable-shared --enable-static --disable-python --disable-gnutls || { cat config.log; exit 1; }
          make -j2
          cp src/.libs/libvte.a "$sysroot/usr/lib/"
          cp -R src "$sysroot/usr/include/vte"
          printf '%s\n' 'Name: vte' 'Description: static VTE' 'Version: 0.28.2' 'Libs: -lvte -lncurses -lX11 -lm' 'Cflags: -I${includedir}/vte' > "$sysroot/usr/lib/pkgconfig/vte.pc"
          cd /tmp
          git clone --depth 1 https://github.com/bfabiszewski/kterm.git kterm
          cd kterm
          git apply "$GITHUB_WORKSPACE/patches/kterm-telegram-paste.diff"
          ./autogen.sh
          ./configure --host="$target" --enable-kindle --sysconfdir=/mnt/us/ktm/kterm
          make -j2
          "$target-strip" kterm
          cp kterm "$GITHUB_WORKSPACE/ktmterm-kindlehf"
      - uses: actions/upload-artifact@v4
        with:
          name: ktmterm-kindlehf
          path: ktmterm-kindlehf
