name: Publish KPM packages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - 'manifest.json'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kpm
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test host shell and menu lifecycle
        run: make test
      - name: Install emulator and BusyBox
        run: sudo apt-get update && sudo apt-get install -y qemu-user busybox-static
      - name: Test BusyBox shell editing
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -DKTM_SHELL='"/bin/busybox"' src/terminal.c -o build/input-busybox
          python3 tests/test_terminal.py build/input-busybox
      - name: Build static Kindle helpers
        run: |
          set -eu
          curl -fsSL https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz -o /tmp/kindlehf.tar.gz
          sha256sum /tmp/kindlehf.tar.gz
          tar -xzf /tmp/kindlehf.tar.gz -C "$HOME"
          target=arm-kindlehf-linux-gnueabihf
          compiler="$HOME/x-tools/$target/bin/$target-gcc"
          mkdir -p native
          "$compiler" -O2 -std=c99 -Wall -Wextra -static src/tgbridge.c -o native/ktm
          "$compiler" -O2 -std=c99 -Wall -Wextra -Werror -static src/terminal.c -o native/ktm-input
          file native/ktm native/ktm-input
      - name: Execute ARM build in QEMU with real PTYs
        run: |
          TEST_RUNNER=qemu-arm python3 tests/test_terminal.py native/ktm-input
          KTM_DATA_DIR=/tmp/ktm-arm-smoke qemu-arm native/ktm status
          TEST_RUNNER=qemu-arm python3 tests/test_run_command.py native/ktm
      - name: Package and verify static ARM binaries
        run: |
          sh tools/build-kpkg.sh native/ktm kindlehf native/ktm-input
          python3 tools/verify-package.py dist/ktm-kindlehf.kpkg
      - name: Publish archive and feed together
        run: |
          python3 tools/publish-feed.py dist/ktm-kindlehf.kpkg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git add -f packages/ktm/artifacts
          git diff --cached --quiet || (git commit -m 'Publish ktm 0.1.16 connection diagnostics package and feed' && git push)
