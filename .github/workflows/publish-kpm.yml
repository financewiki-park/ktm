name: Publish KPM packages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Install Kindle build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf autoconf automake libtool gettext intltool flex bison gperf help2man texinfo libarchive-dev nettle-dev aria2 zstd libncurses-dev libglib2.0-dev-bin
      - name: Build native Kindle terminal
        run: |
          set -eu
          target=arm-kindlehf-linux-gnueabihf
          mkdir -p "$HOME/x-tools"
          curl -fsSL https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz | tar -xzf - -C "$HOME"
          git clone --depth 1 --recurse-submodules https://github.com/KindleModding/kindle-sdk.git /tmp/kindle-sdk
          bash /tmp/kindle-sdk/gen-sdk.sh kindlehf
          toolchain="$HOME/x-tools/$target"
          sysroot="$toolchain/$target/sysroot"
          export PATH="$toolchain/bin:$PATH"
          export PKG_CONFIG_SYSROOT_DIR="$sysroot"
          export PKG_CONFIG_LIBDIR="$sysroot/usr/lib/pkgconfig"
          chmod -R u+w "$sysroot/usr"
          curl -fsSL https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz -o /tmp/ncurses.tar.gz
          tar -xzf /tmp/ncurses.tar.gz -C /tmp
          cd /tmp/ncurses-6.4
          CC="$target-gcc" ./configure --host="$target" --prefix="$sysroot/usr" --without-shared --with-normal --without-debug --without-ada --without-cxx --without-manpages --without-tests --without-progs
          make -j2
          make install.libs install.includes
          cat > "$sysroot/usr/lib/pkgconfig/gio-unix-2.0.pc" <<'EOF'
          Name: gio-unix
          Description: GIO Unix extensions supplied by Kindle firmware
          Version: 2.26.0
          Requires: gio-2.0
          EOF
          cat > "$sysroot/usr/lib/pkgconfig/cairo-xlib.pc" <<'EOF'
          Name: cairo-xlib
          Description: Cairo Xlib backend supplied by Kindle firmware
          Version: 1.10.2
          Requires: cairo x11
          EOF
          curl -fsSL https://download.gnome.org/sources/vte/0.28/vte-0.28.2.tar.xz -o /tmp/vte.tar.xz
          tar -xJf /tmp/vte.tar.xz -C /tmp
          cd /tmp/vte-0.28.2
          CC="$target-gcc" CPPFLAGS="-I$sysroot/usr/include" ./configure --host="$target" --disable-shared --enable-static --disable-python --disable-gnutls
          make -j2
          cp src/.libs/libvte.a "$sysroot/usr/lib/"
          cp -R src "$sysroot/usr/include/vte"
          printf '%s\n' 'Name: vte' 'Description: static VTE' 'Version: 0.28.2' 'Libs: -lvte -lncurses -lX11 -lm' 'Cflags: -I${includedir}/vte' > "$sysroot/usr/lib/pkgconfig/vte.pc"
          cd /tmp
          git clone --depth 1 https://github.com/bfabiszewski/kterm.git kterm
          cd kterm
          git apply "$GITHUB_WORKSPACE/patches/kterm-telegram-paste.diff"
          ./autogen.sh
          ./configure --host="$target" --enable-kindle --sysconfdir=/mnt/us/kterm
          make -j2
          "$target-strip" kterm
          mkdir -p "$GITHUB_WORKSPACE/native"
          cp kterm "$GITHUB_WORKSPACE/native/ktmterm"
      - name: Build KPM 0.2.x-compatible archives
        run: |
          mkdir -p packages/ktm/artifacts
          make clean
          make CC=arm-linux-gnueabihf-gcc CFLAGS='-O2 -std=c99 -Wall -Wextra -Wpedantic' LDFLAGS='-static' LDLIBS='-ldl'
          file build/ktm
          KTM_VERSION=0.1.7 sh tools/build-kpkg.sh ./build/ktm kindlehf ./native/ktmterm
          cp dist/ktm-kindlehf.kpkg packages/ktm/artifacts/ktm_0.1.7_kindlehf.kpkg
      - name: Verify archive layout and manifest v2
        run: |
          python3 - <<'PY'
          import json, tarfile
          for path in ('packages/ktm/artifacts/ktm_0.1.7_kindlehf.kpkg',):
              with tarfile.open(path, 'r:gz') as archive:
                  names = archive.getnames()
                  assert 'manifest.json' in names, names
                  assert './manifest.json' not in names, names
                  manifest = json.load(archive.extractfile('manifest.json'))
                  assert manifest['manifest_version'] == 2
                  assert manifest['version'] == [0, 1, 7]
                  assert {'install.sh', 'launch.sh', 'uninstall.sh', 'ui.sh', 'bin/ktm', 'bin/ktmterm', 'assets/ktm-icon.png', 'scriptlet/ktm.sh'} <= set(names)
          PY
      - name: Commit immutable package artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f packages/ktm/artifacts
          git diff --cached --quiet || (git commit -m 'Publish ktm 0.1.7 KPM artifacts' && git push)
