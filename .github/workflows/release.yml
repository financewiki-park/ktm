name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Install Kindle cross compilers
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi
      - name: Build ARM Kindle packages
        run: |
          mkdir -p release-assets
          make clean
          make CC=arm-linux-gnueabihf-gcc CFLAGS='-O2 -std=c99 -Wall -Wextra -Wpedantic' LDFLAGS='-static'
          file build/ktm
          make package TARGET_PLATFORM=kindlehf
          cp dist/ktm-kindlehf.kpkg release-assets/ktm-kindlehf.kpkg
          make clean
          make CC=arm-linux-gnueabi-gcc CFLAGS='-O2 -std=c99 -Wall -Wextra -Wpedantic' LDFLAGS='-static'
          file build/ktm
          make package TARGET_PLATFORM=kindlepw2
          cp dist/ktm-kindlepw2.kpkg release-assets/ktm-kindlepw2.kpkg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/ktm-kindlehf.kpkg \
            release-assets/ktm-kindlepw2.kpkg \
            --repo "$GITHUB_REPOSITORY" \
            --title "ktm $GITHUB_REF_NAME" \
            --generate-notes
